<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mrbd-web-app-capable" content="yes">
<meta name="description" content="Rotate a 3D wireframe model on Meta Ray-Ban Display.">
<title>Schematic HUD</title>
<style>
  /* black = unlit = see-through on the glasses, so only the lines float in view */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; right: 12px; bottom: 10px; color: #8ab; font: 16px system-ui, sans-serif; background: none; border: 0; padding: 0; text-align: right; white-space: pre; }
  #title { position: fixed; left: 12px; top: 10px; color: #fff; font-size: 20px; }
</style>
</head>
<body>
<canvas role="img" aria-label="3D wireframe of a 5mm LED"></canvas>
<div id="title">5mm LED</div>
<!-- the one focusable control: pinch on the glasses = Enter = click on this button -->
<button id="hud" autofocus></button>
<script>
  // --- model: list of line segments [[x,y,z],[x,y,z]], units ~mm ---
  const segs = [], TAU = Math.PI * 2;
  const ring = (r, y, n = 24) => {
    for (let i = 0; i < n; i++) {
      const a = i / n * TAU, b = (i + 1) / n * TAU;
      segs.push([[r * Math.cos(a), y, r * Math.sin(a)], [r * Math.cos(b), y, r * Math.sin(b)]]);
    }
  };
  ring(2.9, 0); ring(2.9, 1);                     // flange
  ring(2.5, 1); ring(2.5, 6);                     // body
  ring(2.5 * Math.cos(0.5), 6 + 2.5 * Math.sin(0.5));   // dome latitudes
  ring(2.5 * Math.cos(1.05), 6 + 2.5 * Math.sin(1.05));
  for (let i = 0; i < 8; i++) {
    const t = i / 8 * TAU, c = Math.cos(t), s = Math.sin(t);
    segs.push([[2.9 * c, 0, 2.9 * s], [2.9 * c, 1, 2.9 * s]]);  // flange edge
    segs.push([[2.5 * c, 1, 2.5 * s], [2.5 * c, 6, 2.5 * s]]);  // body edge
    for (let j = 0; j < 6; j++) {                               // dome meridian
      const p = j / 6 * Math.PI / 2, q = (j + 1) / 6 * Math.PI / 2;
      segs.push([[2.5 * Math.cos(p) * c, 6 + 2.5 * Math.sin(p), 2.5 * Math.cos(p) * s],
                 [2.5 * Math.cos(q) * c, 6 + 2.5 * Math.sin(q), 2.5 * Math.cos(q) * s]]);
    }
  }
  segs.push([[1.27, 0, 0], [1.27, -14, 0]]);      // anode (+), longer leg
  segs.push([[-1.27, 0, 0], [-1.27, -11, 0]]);    // cathode (−)

  // --- render ---
  const cv = document.querySelector('canvas'), ctx = cv.getContext('2d'), hud = document.getElementById('hud');
  const D = 40, STEP = Math.PI / 12;  // camera distance, 15° per swipe
  const SIGN = 1;  // calibration: flip to -1 if the model turns the wrong way as you walk around it
  let yaw = 0.6, pitch = 0.35, mode = 'spin';
  let heading = null, alpha0 = null, yaw0 = 0, seenAt = 0, raw = '';

  function project([x, y, z]) {
    y += 3;  // center the model vertically
    const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const x1 = x * cy + z * sy, z1 = z * cy - x * sy;
    const y1 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
    const k = Math.min(cv.width, cv.height) * 1.1 / (z2 + D);
    return [cv.width / 2 + x1 * k, cv.height / 2 - y1 * k, z2];
  }

  function resize() {
    cv.width = innerWidth * (devicePixelRatio || 1); cv.height = innerHeight * (devicePixelRatio || 1);
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.lineWidth = 2 * (devicePixelRatio || 1); ctx.strokeStyle = '#4df'; ctx.lineCap = 'round';
    for (const [a, b] of segs) {
      const p = project(a), q = project(b);
      // depth cue: far lines dimmer, which is most of what makes a wireframe read as 3D
      ctx.globalAlpha = Math.min(1, Math.max(0.25, 0.6 - (p[2] + q[2]) / 30));
      ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); ctx.stroke();
    }
    hud.textContent = mode === 'spin' ? 'pinch: walk-around mode  ·  swipe: rotate'
      : (performance.now() - seenAt > 1000 ? 'waiting for head tracking…' : `walk-around  ${raw}`)
        + '\npinch: spin mode  ·  swipe: adjust';
  }

  // Walk-around: no position tracking exists, so map head heading to model yaw.
  // Circling the spot while facing it turns your heading 360°, so you see each side.
  // ponytail: heading-only, so turning your head in place also turns the model; true 6DoF needs position tracking Meta doesn't expose
  addEventListener('deviceorientation', e => {
    if (!Number.isFinite(e.alpha)) return;
    if (alpha0 === null) { alpha0 = e.alpha; yaw0 = yaw; }
    heading = e.alpha; seenAt = performance.now();
    raw = `α${e.alpha | 0} β${e.beta | 0} γ${e.gamma | 0}`;  // shown so axes can be checked on-device
  });

  // ponytail: one 30 Hz loop (panel is 30 Hz), sensor events only store the latest reading
  setInterval(() => {
    if (mode === 'spin') yaw += 0.02;
    else if (alpha0 !== null) yaw = yaw0 + SIGN * (heading - alpha0) * Math.PI / 180;
    draw();
  }, 33);

  hud.addEventListener('click', async () => {
    if (mode === 'walk') { mode = 'spin'; return draw(); }
    try {
      const ask = window.DeviceOrientationEvent && DeviceOrientationEvent.requestPermission;
      if (ask && await DeviceOrientationEvent.requestPermission() !== 'granted') throw 0;
    } catch { hud.textContent = 'motion sensor access was not granted\npinch to try again'; return; }
    mode = 'walk'; alpha0 = null;  // whatever angle you see now becomes "straight ahead"
    draw();
  });

  addEventListener('keydown', e => {
    const turn = { ArrowLeft: [-STEP, 0], ArrowRight: [STEP, 0], ArrowUp: [0, -STEP], ArrowDown: [0, STEP] }[e.key];
    if (!turn) return;  // Enter falls through to the button's click
    yaw += turn[0]; yaw0 += turn[0]; pitch += turn[1];
    e.preventDefault();
    draw();
  });
  addEventListener('resize', resize);
  hud.focus();
  resize();
</script>
</body>
</html>
